[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-agentic-orchestration"
version = "0.1.0"
description = "Reference implementation for Asynchronous Agentic Orchestration at Scale"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Angshul Majumdar"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
